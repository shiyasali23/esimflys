<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;

            white-space: nowrap;
            direction: ltr;
        }

<body class="font-body-md text-on-surface flex flex-col min-h-screen">
<!-- Auth Shell Suppression: No TopNavBar or SideNav as per Destination Rule for Transactional Screens -->
<main class="flex-grow flex items-center justify-center px-6 py-128">
<!-- Background Atmospheric Element (Optional subtle shader or gradient) -->
<div class="fixed inset-0 z-[-1] opacity-40 pointer-events-none">

</div>
<div class="w-full max-w-[440px] ruthless-whitespace">
<!-- Brand Anchor -->
<div class="flex justify-center mb-12">
<span class="font-display-lg text-headline-md tracking-tighter text-primary">eSIMFlys</span>
</div>
<!-- Centered Auth Card -->
<div class="bg-surface-container-lowest border border-line rounded-xl p-32 auth-card">
<div class="text-center mb-32">
<p class="font-label-caps text-label-caps text-primary mb-8">Reset password</p>
<h1 class="font-headline-md text-headline-md text-on-surface">Forgot your password?</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-12 px-8">
                        Enter your email address and we'll send you a 6-digit code to reset your account access.
                    </p>
</div>
<form class="space-y-24" id="forgotPasswordForm">
<div class="space-y-8">
<label class="font-label-bold text-label-bold text-on-surface-variant block ml-4" for="email">
                            Email address
                        </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-12 top-1/2 -translate-y-1/2 text-outline-variant">
                                mail
                            </span>
<input class="w-full pl-44 pr-16 py-12 bg-paper border border-line rounded-[10px] focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all duration-200 font-body-md text-on-surface placeholder:text-outline" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary py-16 rounded-[10px] font-label-bold text-label-bold hover:bg-primary-container active:scale-[0.98] transition-all duration-200 shadow-sm" type="submit">
                        Send code
                    </button>
</form>
<div class="mt-32 text-center">
<a class="inline-flex items-center gap-8 font-label-bold text-label-bold text-primary hover:text-on-primary-fixed-variant transition-colors duration-200" href="/auth/signin">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                        Back to sign in
                    </a>
</div>
</div>
<!-- Security Trust Indicator -->
<div class="mt-32 flex items-center justify-center gap-12 text-on-surface-variant/60">
<span class="material-symbols-outlined text-[20px]">lock</span>
<span class="font-label-caps text-[10px] uppercase tracking-widest">Secure 256-bit encrypted authentication</span>
</div>
</div>
</main>
<!-- Simple Footer for Transactional Pages -->
<footer class="w-full py-24 px-6">
<div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-16">
<p class="font-body-sm text-body-sm text-on-surface-variant">© 2024 eSIMFlys Global. All rights reserved.</p>
<div class="flex gap-24">
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">Contact Us</a>
</div>
</div>
</footer>
<script>
        // Micro-interactions and form handling
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const button = this.querySelector('button');
            const originalText = button.innerText;
            
            // Visual feedback
            button.disabled = true;
            button.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Sending...';
            
            // Simulate API call
            setTimeout(() => {
                button.classList.replace('bg-primary', 'bg-success');
                button.classList.add('text-on-background');
                button.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Code Sent';
                
                // Add success toast (simplified)
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-32 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-24 py-12 rounded-full shadow-xl flex items-center gap-12 animate-bounce';
                toast.innerHTML = '<span class="material-symbols-outlined text-success">check</span> Check your inbox for the reset code';
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.remove();
                    button.disabled = false;
                    button.innerText = originalText;
                    button.classList.replace('bg-success', 'bg-primary');
                    button.classList.remove('text-on-background');
                }, 4000);
            }, 1500);
        });

        // Simple parallax on mouse move for the background shader (if present)
        document.addEventListener('mousemove', (e) => {
            const shader = document.querySelector('webgl-shader');
            if (shader) {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                shader.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });
    </script>
