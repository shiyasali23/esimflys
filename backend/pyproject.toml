[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esimflys-backend"
version = "0.1.0"
description = "eSIMFlys backend — Django monolith for catalogue, checkout, payments, eSIM provisioning, and commissions."
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.15,<3.16",
    "django-environ>=0.11",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "gunicorn>=22",
    "stripe>=10",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "django-allauth>=65",
    "PyJWT>=2.0",
]

[tool.setuptools]
packages = []
